<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>MotivBom AI Studio</title><style>body{margin:0;padding:18px;background:#0d1015;color:#f5f7fa;font:16px system-ui}.card,textarea,input,button{box-sizing:border-box;width:100%;border:1px solid #303947;border-radius:14px;background:#171c24;color:inherit;padding:14px;margin:7px 0}button{text-align:left;font-weight:700}.active{border-color:#54d68d;background:#133b2c}.hide{display:none}.muted{color:#a5afbd;font-size:13px}#result{white-space:pre-wrap;line-height:1.45}</style><body><h1>MotivBom AI Studio</h1><p class="muted">Отдельный кабинет для @motivbom.ai</p><button class="card" data-a="analyst">🔎 Аналитик<br><span class="muted">Метрики → косяки и гипотезы</span></button><button class="card" data-a="scriptwriter">✍️ Сценарист<br><span class="muted">Отчёт → 3 сценария</span></button><button class="card" data-a="director">🎬 Контент-директор<br><span class="muted">Сценарий → обложка, CTA, A/B-тест</span></button><section id="form" class="hide"><h2 id="name"></h2><div id="metrics" class="hide"><input name="views" placeholder="Просмотры"><input name="likes" placeholder="Лайки"><input name="comments" placeholder="Комментарии"><input name="shares" placeholder="Репосты"><input name="saves" placeholder="Сохранения"></div><textarea id="context" placeholder="Опиши ролик или вставь результат предыдущего агента"></textarea><button id="go">Запустить</button></section><section id="out" class="hide"><h2>Результат</h2><div id="result"></div><button id="next" class="hide">Передать следующему →</button></section><script>const tg=Telegram.WebApp;tg.ready();tg.expand();let agent,last='';const title={analyst:'Аналитик',scriptwriter:'Сценарист',director:'Контент-директор'},following={analyst:'scriptwriter',scriptwriter:'director'};document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>select(x.dataset.a));function select(a,text=''){agent=a;name.textContent=title[a];context.value=text;form.classList.remove('hide');out.classList.add('hide');metrics.classList.toggle('hide',a!=='analyst')}go.onclick=async()=>{go.disabled=true;const fd=new FormData();fd.append('init_data',tg.initData);fd.append('context',context.value);document.querySelectorAll('#metrics input').forEach(x=>fd.append(x.name,x.value));try{const r=await fetch('/api/'+agent,{method:'POST',body:fd}),j=await r.json();if(!r.ok)throw Error(j.error);last=j.answer;result.textContent=last;out.classList.remove('hide');next.classList.toggle('hide',!following[agent])}catch(e){tg.showAlert(e.message)}finally{go.disabled=false}};next.onclick=()=>select(following[agent],last);</script>
